<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>CI-RCT · Follow-the-money 時序 DAG(3D)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0e1117; --panel:rgba(22,27,34,.92); --border:#30363d;
          --text:#e6edf3; --muted:#8b949e; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  #graph { position:fixed; inset:0; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); font-size:13px;
    line-height:1.55; z-index:10; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  #info{ top:14px; left:14px; max-width:300px; }
  #legend{ top:14px; right:14px; max-width:260px; }
  #hover{ bottom:14px; right:14px; max-width:340px; display:none;
    font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  #axis{ left:14px; bottom:14px; }
  h1{ font-size:15px; margin:0 0 6px; }
  h2{ font-size:12px; margin:10px 0 4px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; }
  .row{ display:flex; align-items:center; gap:8px; margin:3px 0; }
  .dot{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .sq{ width:14px; height:0; border-top:3px solid; flex:0 0 auto; }
  .count{ margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  .muted{ color:var(--muted); }
  label.ctrl{ display:flex; align-items:center; gap:6px; margin:4px 0; cursor:pointer; }
  input[type=file]::file-selector-button{ background:#21262d; color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:4px 8px;
    font-size:12px; cursor:pointer; }
  .badge{ display:inline-block; padding:1px 6px; border-radius:6px; font-size:11px;
    background:#21262d; border:1px solid var(--border); }
  .src{ color:#79c0ff; }
  .grad{ height:10px; border-radius:5px; margin:4px 0 2px;
    background:linear-gradient(90deg,#79c0ff,#30363d); }
</style>
<script src="lib/3d-force-graph.min.js"></script>
</head>
<body>
<div id="graph"></div>

<div id="info" class="panel">
  <h1>Follow-the-money 時序 DAG(3D)</h1>
  <div class="muted" id="meta">載入中…</div>
  <h2>顯示控制</h2>
  <label class="ctrl"><input type="checkbox" id="ck-timez" checked /> 時間軸固定 Z(深處＝晚)</label>
  <label class="ctrl"><input type="checkbox" id="ck-band" /> 依類型分帶(Y)</label>
  <label class="ctrl"><input type="checkbox" id="ck-particles" checked /> 邊上金流方向粒子</label>
  <h2>載入資料</h2>
  <div class="muted">預設讀 <span class="src">dag_elliptic.json</span>(需經 http);失敗則用內建示範資料。</div>
  <input type="file" id="file" accept="application/json" style="margin-top:6px; max-width:240px;" />
</div>

<div id="legend" class="panel">
  <h2>節點</h2>
  <div id="legend-nodes"></div>
  <h2>邊(因 → 果)</h2>
  <div id="legend-edges"></div>
</div>

<div id="axis" class="panel">
  <h2>Z 軸 ＝ 時間</h2>
  <div class="grad"></div>
  <div class="row" style="font-size:11px"><span>近(早)</span><span class="count" id="axisRange">—</span><span>遠(晚)</span></div>
</div>

<div id="hover" class="panel"></div>

<script>
// ── 顏色 ─────────────────────────────────────────────────────────────────────
const TYPE_COLOR = { transaction:"#4c9be8", wallet:"#d9a441" };
const FRAUD_COLOR = "#f0506e";
const EDGE_COLOR = {
  "transaction__to__transaction":"#4c9be8",
  "wallet__to__transaction":"#4caf72",
  "transaction__to__wallet":"#e08e3c",
};
const EDGE_LABEL = {
  "transaction__to__transaction":"tx → tx(金流順時間)",
  "wallet__to__transaction":"wallet → tx(資金注入)",
  "transaction__to__wallet":"tx → wallet(支付)",
};
const typeColor = t => TYPE_COLOR[t] || "#9aa7b3";
const edgeColor = e => EDGE_COLOR[e] || "#5a6673";
const nodeColor = n => n.fraud ? FRAUD_COLOR : typeColor(n.type);
const nodeSize  = n => (n.fraud ? 5 : (n.is_seed ? 4 : 2.6));

// ── 內建示範資料(fetch 失敗時用)────────────────────────────────────────────
function buildDemo(){
  const nodes = [
    { id:0, type:"wallet",      time:1,    label:"wallet#0", fraud:true },
    { id:1, type:"transaction", time:1,    label:"tx#0",     fraud:true, is_seed:true },
    { id:2, type:"transaction", time:1,    label:"tx#1",     fraud:false },
    { id:3, type:"transaction", time:2,    label:"tx#2",     fraud:true },
    { id:4, type:"wallet",      time:2,    label:"wallet#1", fraud:false },
    { id:5, type:"transaction", time:3,    label:"tx#3",     fraud:false },
    { id:6, type:"transaction", time:4,    label:"tx#4",     fraud:false },
    { id:7, type:"wallet",      time:5,    label:"wallet#3", fraud:false },
    { id:8, type:"transaction", time:5,    label:"tx#5",     fraud:false },
    { id:9, type:"wallet",      time:null, label:"wallet#2", fraud:false },
  ];
  const links = [
    { source:0, target:1, etype:"wallet__to__transaction" },
    { source:1, target:2, etype:"transaction__to__transaction" },
    { source:1, target:3, etype:"transaction__to__transaction" },
    { source:4, target:3, etype:"wallet__to__transaction" },
    { source:3, target:5, etype:"transaction__to__transaction" },
    { source:1, target:4, etype:"transaction__to__wallet" },
    { source:5, target:6, etype:"transaction__to__transaction" },
    { source:6, target:8, etype:"transaction__to__transaction" },
    { source:7, target:8, etype:"wallet__to__transaction" },
    { source:8, target:7, etype:"transaction__to__wallet" },
    { source:9, target:1, etype:"wallet__to__transaction" },
  ];
  return { meta:{ dataset:"DEMO(結構同 elliptic++,非真實數據)", demo:true,
                  n_nodes:nodes.length, n_links:links.length }, nodes, links };
}

// ── 狀態 ─────────────────────────────────────────────────────────────────────
let Graph, RAW, timeZ = true, bandY = false, particles = true;
const STEP = 70, BAND = 90, GUT_PAD = 1;

function layoutMeta(){
  const timed = RAW.nodes.filter(n => n.time != null).map(n => n.time);
  const tMin = timed.length ? Math.min(...timed) : 0;
  const tMax = timed.length ? Math.max(...timed) : 0;
  const types = [...new Set(RAW.nodes.map(n => n.type))].sort();
  const bandOf = {}; types.forEach((t,i) => bandOf[t] = (i - (types.length-1)/2) * BAND);
  return { tMin, tMax, bandOf };
}

function applyLayout(){
  const { tMin, bandOf } = layoutMeta();
  RAW.nodes.forEach(n => {
    const t = (n.time == null) ? (tMin - GUT_PAD) : n.time;
    n.fz = timeZ ? (t - tMin) * STEP : undefined;
    n.fy = bandY ? bandOf[n.type] : undefined;
    n.fx = undefined;
  });
}

const linkColorFn = l => edgeColor(l.etype);

function render(){
  applyLayout();
  Graph.graphData(RAW);                 // 同一批 node 物件,重新套用 pin
  Graph.linkDirectionalParticles(particles ? 2 : 0);
}

function build(data){
  RAW = data;
  const m = data.meta || {};
  document.getElementById("meta").innerHTML =
    `<span class="badge">${m.dataset||"graph"}</span> · ${data.nodes.length} 節點 / ${data.links.length} 邊`
    + (m.demo ? `<br><span style="color:#e0a000">⚠ 內建示範資料</span>` : "");
  const { tMin, tMax } = layoutMeta();
  document.getElementById("axisRange").textContent =
    (data.nodes.some(n=>n.time!=null)) ? `t=${tMin} … t=${tMax}` : "(無時間戳)";

  const el = document.getElementById("graph");
  el.innerHTML = "";
  Graph = ForceGraph3D()(el)
    .backgroundColor("#0e1117")
    .nodeColor(nodeColor)
    .nodeVal(nodeSize)
    .nodeOpacity(0.95)
    .nodeLabel(n => `<div style="font-family:ui-monospace,Menlo;font-size:12px">
        <b>${n.label||n.id}</b><br>type=${n.type}<br>time=${n.time==null?"—(無)":n.time}
        ${n.fraud?'<br><span style="color:#f0506e">★ illicit / fraud</span>':""}
        ${n.is_seed?'<br>BFS seed':""}</div>`)
    .linkColor(linkColorFn)
    .linkWidth(0.6)
    .linkOpacity(0.5)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalParticleWidth(2)
    .onNodeClick(n => { Graph.cameraPosition({x:n.x,y:n.y,z:n.z+120}, n, 800); showHover(n); })
    .onNodeHover(n => { document.getElementById("graph").style.cursor = n?"pointer":null; if(n) showHover(n); });

  Graph.d3Force("charge").strength(-55);
  render();
  buildLegend();
  // 斜角初始視角,讓 Z 軸(時間)分層一眼可見
  setTimeout(() => Graph.cameraPosition({ x: 260, y: 90, z: 360 }, { x: 0, y: 0, z: 0 }, 0), 60);
}

function showHover(n){
  const h = document.getElementById("hover");
  h.style.display = "block";
  h.innerHTML = `<b>${n.label||n.id}</b><br>id: ${n.id}<br>type: ${n.type}`
    + `<br>time: ${n.time==null?"—(無時間戳,不受約束)":n.time}`
    + (n.fraud?`<br><span style="color:#f0506e">★ illicit / fraud</span>`:"")
    + (n.is_seed?`<br>BFS seed`:"");
}

function buildLegend(){
  const counts = {}; RAW.nodes.forEach(n => counts[n.type]=(counts[n.type]||0)+1);
  document.getElementById("legend-nodes").innerHTML =
    Object.keys(counts).sort().map(t =>
      `<div class="row"><span class="dot" style="background:${typeColor(t)}"></span>${t}<span class="count">${counts[t]}</span></div>`
    ).join("")
    + `<div class="row"><span class="dot" style="background:${FRAUD_COLOR}"></span>illicit / fraud<span class="count">${RAW.nodes.filter(n=>n.fraud).length}</span></div>`;
  const ec={}; RAW.links.forEach(l=>ec[l.etype]=(ec[l.etype]||0)+1);
  document.getElementById("legend-edges").innerHTML =
    Object.keys(EDGE_LABEL).filter(e=>ec[e]).map(e =>
      `<div class="row"><span class="sq" style="border-color:${EDGE_COLOR[e]}"></span><span>${EDGE_LABEL[e]}</span><span class="count">${ec[e]}</span></div>`
    ).join("");
}

// ── 控制項 ───────────────────────────────────────────────────────────────────
document.getElementById("ck-timez").onchange     = e => { timeZ=e.target.checked; render(); };
document.getElementById("ck-band").onchange      = e => { bandY=e.target.checked; render(); };
document.getElementById("ck-particles").onchange = e => { particles=e.target.checked; Graph.linkDirectionalParticles(particles?2:0); };
document.getElementById("file").onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ build(JSON.parse(r.result)); }catch(err){ alert("JSON 解析失敗: "+err);} }; r.readAsText(f);
};

// ── 啟動 ─────────────────────────────────────────────────────────────────────
fetch("dag_elliptic.json", { cache:"no-store" }).then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(d => build(d))
  .catch(() => build(buildDemo()));
</script>
</body>
</html>
