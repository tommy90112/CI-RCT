<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>CI-RCT · 犯罪鏈(真實 txId / 錢包地址)</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --border:#30363d; --ink:#e6edf3;
          --muted:#8b949e; --tx:#4c9be8; --wallet:#d9a441; --fraud:#f0506e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  #app { display:flex; height:100vh; }
  #side { width:250px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    padding:14px 16px; overflow-y:auto; }
  #main { flex:1; overflow-y:auto; padding:16px 20px; }
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .sec { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:14px 0 6px; }
  .row { display:flex; gap:8px; font-size:13px; margin:4px 0; }
  .row .v { margin-left:auto; font-variant-numeric:tabular-nums; }
  .banner { color:var(--muted); font-size:12px; margin-bottom:10px; }

  .chain { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:14px; }
  .chain-head { font-size:13px; margin-bottom:10px; color:var(--muted); }
  .chain-head b { color:var(--ink); }
  .flow { display:flex; align-items:center; gap:2px; overflow-x:auto; padding-bottom:6px; }
  .node { flex:none; min-width:130px; max-width:170px; border:2px solid var(--border);
    border-radius:8px; padding:7px 9px; background:#0d1117; }
  .node.tx { border-color:var(--tx); }
  .node.wallet { border-color:var(--wallet); }
  .node.fraud { border-color:var(--fraud); box-shadow:0 0 0 1px var(--fraud) inset; }
  .node .ty { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .node .id { font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all;
    margin:2px 0; }
  .node .meta { font-size:11px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:10px; padding:0 5px; border-radius:5px; border:1px solid var(--border); }
  .tag.fraud { color:var(--fraud); border-color:var(--fraud); }
  .tag.root { color:#4caf72; border-color:#4caf72; }
  .tag.target { color:var(--tx); border-color:var(--tx); }
  .edge { flex:none; display:flex; flex-direction:column; align-items:center; color:var(--muted);
    font-size:10px; min-width:54px; }
  .edge .arrow { font-size:16px; line-height:1; color:#5a6673; }
  .edge .ce { font-variant-numeric:tabular-nums; }
  .legend .row { font-size:12px; align-items:center; }
  .sw { width:14px; height:14px; border-radius:4px; border:2px solid; flex:none; }
  .hint { color:var(--muted); font-size:11px; line-height:1.6; margin-top:12px; }
  code { background:#0d1117; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>犯罪鏈追蹤</h1>
    <div class="sub">真實 txId / 比特幣地址 · 左＝源頭、右＝被標記詐騙</div>
    <div class="sec">摘要</div>
    <div class="row"><span>資料集</span><span class="v" id="mDs">—</span></div>
    <div class="row"><span>checkpoint</span><span class="v" id="mCk">—</span></div>
    <div class="row"><span>鏈數</span><span class="v" id="mN">—</span></div>
    <div class="row"><span>平均深度</span><span class="v" id="mD">—</span></div>
    <div class="row"><span>root 命中詐騙</span><span class="v" id="mF">—</span></div>
    <div class="sec">圖例</div>
    <div class="legend">
      <div class="row"><span class="sw" style="border-color:var(--tx)"></span>transaction(txId)</div>
      <div class="row"><span class="sw" style="border-color:var(--wallet)"></span>wallet(地址)</div>
      <div class="row"><span class="sw" style="border-color:var(--fraud)"></span>已標記 illicit</div>
    </div>
    <div class="hint">
      箭頭方向＝資金順時間往前流(源頭 → 被標記交易)。<br>
      箭頭上的 <code>CE</code> 是該邊的因果效應分數,tracer 就是沿著它往回追。<br>
      <code>t=</code> 是 Elliptic 時間步。<br><br>
      讀 <code>crime_chains.json</code>;讀不到時顯示內建示範。
    </div>
  </div>
  <div id="main">
    <div class="banner" id="banner">載入中…</div>
    <div id="chains"></div>
  </div>
</div>

<script>
const trunc = s => (s && s.length > 16) ? s.slice(0, 9) + "…" + s.slice(-4) : s;
const ceColor = v => v < 0 ? "#f0506e" : "#4caf72";

const DEMO = {
  meta: { dataset:"DEMO(非真實數據)", checkpoint:"—", n_chains:3, mean_depth:3.0, n_fraud_root:2, demo:true },
  chains: [
    { target_txid:"3321", depth:3, root_type:"wallet", root_real_id:"3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy", root_is_fraud:true,
      nodes:[
        { pos:0, type:"transaction", real_id:"3321", time:12, fraud:true, is_target:true },
        { pos:1, type:"wallet", real_id:"1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa", time:11, fraud:true, ce:-0.42 },
        { pos:2, type:"transaction", real_id:"88017", time:9, fraud:false, ce:0.31 },
        { pos:3, type:"wallet", real_id:"3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy", time:7, fraud:true, ce:-0.55 },
      ]},
    { target_txid:"45102", depth:2, root_type:"wallet", root_real_id:"1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2", root_is_fraud:true,
      nodes:[
        { pos:0, type:"transaction", real_id:"45102", time:20, fraud:true, is_target:true },
        { pos:1, type:"transaction", real_id:"45090", time:18, fraud:false, ce:-0.28 },
        { pos:2, type:"wallet", real_id:"1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2", time:15, fraud:true, ce:-0.61 },
      ]},
    { target_txid:"77820", depth:2, root_type:"transaction", root_real_id:"77001", root_is_fraud:false,
      nodes:[
        { pos:0, type:"transaction", real_id:"77820", time:31, fraud:true, is_target:true },
        { pos:1, type:"wallet", real_id:"1F1tAaz5x1HUXrCNLbtMDqcw6o5GNn4xqX", time:30, fraud:false, ce:-0.18 },
        { pos:2, type:"transaction", real_id:"77001", time:28, fraud:false, ce:0.12 },
      ]},
  ],
};

function nodeCard(n) {
  const cls = ["node", n.type === "transaction" ? "tx" : "wallet"];
  if (n.fraud) cls.push("fraud");
  const tags = [];
  if (n.is_target) tags.push(`<span class="tag target">target</span>`);
  if (n._root) tags.push(`<span class="tag root">root</span>`);
  if (n.fraud) tags.push(`<span class="tag fraud">illicit</span>`);
  const tcol = (n.time == null) ? "t?" : ("t=" + n.time);
  return `<div class="${cls.join(" ")}">
    <div class="ty">${n.type === "transaction" ? "TX" : "WALLET"}</div>
    <div class="id" title="${n.real_id}">${trunc(n.real_id)}</div>
    <div class="meta"><span>${tcol}</span>${tags.join("")}</div>
  </div>`;
}

function edgeCell(ce) {
  return `<div class="edge">
    <span class="ce" style="color:${ceColor(ce)}">CE ${ce >= 0 ? "+" : ""}${ce.toFixed(3)}</span>
    <span class="arrow">▶</span>
  </div>`;
}

function renderChain(c, i) {
  // reverse so root (source) is left, target (flagged fraud) is right
  const seq = [...c.nodes].reverse();
  let html = "";
  seq.forEach((n, j) => {
    // mark the leftmost node as root (unless the chain is just the target)
    const node = { ...n, _root: (j === 0 && !n.is_target) };
    html += nodeCard(node);
    // edge between seq[j] (parent) and seq[j+1] (child): CE is stored on seq[j]
    if (j < seq.length - 1) html += edgeCell(n.ce != null ? n.ce : 0);
  });
  const rootTxt = `${c.root_type === "wallet" ? "wallet" : "tx"} ${trunc(c.root_real_id)}`
    + (c.root_is_fraud ? " ✓illicit" : "");
  return `<div class="chain">
    <div class="chain-head">#${i + 1} · 詐騙交易 <b>tx ${c.target_txid}</b> · 深度 ${c.depth} · root = ${rootTxt}</div>
    <div class="flow">${html}</div>
  </div>`;
}

function fill(data) {
  const m = data.meta || {};
  const g = (id, v) => document.getElementById(id).textContent = v;
  g("mDs", m.dataset || "—"); g("mCk", m.checkpoint || "—");
  g("mN", m.n_chains ?? data.chains.length);
  g("mD", m.mean_depth ?? "—");
  g("mF", `${m.n_fraud_root ?? "?"} / ${data.chains.length}`);
  document.getElementById("banner").textContent =
    `${m.dataset || "graph"} · ${data.chains.length} 條犯罪鏈` + (m.demo ? " · ⚠ 內建示範" : "");
  document.getElementById("chains").innerHTML =
    data.chains.map((c, i) => renderChain(c, i)).join("");
}

fetch("crime_chains.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => fill(d))
  .catch(() => { DEMO.meta.dataset += " · 找不到 crime_chains.json"; fill(DEMO); });
</script>
</body>
</html>
